services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  scraper:
    build: ./backend
    command: ["watchmedo", "auto-restart", "-d", ".", "-p", "*.py", "--recursive", "--", "python", "bot.py"]
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
